[pytest]
addopts =
    --strict-markers
    --alluredir=allure-results
    -n auto
    --reruns 2
    --reruns-delay 1
markers =
    unit: быстрые тесты без внешних зависимостей
    integration: тесты против поднятого сервиса (mock-api)
    e2e: браузерные тесты через Playwright
    smoke: быстрые проверки
    regression: полный регресс
    auth: тесты авторизации
    flaky: нестабильные тесты, гоняем с повышенным числом ретраев
    serial: тесты, которые нельзя запускать параллельно
