name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ALLURE_VERSION: "2.46.1"

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-allure
        with:
          version: ${{ env.ALLURE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -m unit -n auto --reruns 1 --alluredir=allure-results

      - name: Generate Allure report
        if: always()
        run: |
          allure generate allure-results -o allure-report --clean || echo "отчёт не собран"
          python make_badge.py || true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-unit
          path: |
            allure-results
            allure-report
            badges
          retention-days: 14

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v4

      - name: Start mock API
        run: docker compose up -d --build mock-api

      - name: Wait for mock API
        run: |
          attempt=0
          until curl -fsS "$API_BASE_URL/health" > /dev/null; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 30 ]; then
              docker compose logs mock-api
              echo "mock-api не поднялся"
              exit 1
            fi
            sleep 2
          done
          echo "mock-api готов"

      - uses: ./.github/actions/setup-allure
        with:
          version: ${{ env.ALLURE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run integration tests
        run: pytest -m integration -n auto --reruns 1 --alluredir=allure-results

      - name: Stop mock API
        if: always()
        run: docker compose down -v

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results -o allure-report --clean || echo "отчёт не собран"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-integration
          path: |
            allure-results
            allure-report
          retention-days: 14

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-allure
        with:
          version: ${{ env.ALLURE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium

      - name: Run e2e tests
        run: >
          pytest -m e2e -n 2 --reruns 2 --reruns-delay 2
          --alluredir=allure-results
          --dist=loadfile
          --tx 'shard=p*2+s${{ matrix.shard }}'

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results -o allure-report --clean || echo "отчёт не собран"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e-shard-${{ matrix.shard }}
          path: |
            allure-results
            allure-report
          retention-days: 14

  smoke:
    name: Smoke on PR
    runs-on: ubuntu-latest
    needs: [unit]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium

      - name: Run smoke tests
        run: pytest -m "smoke and not integration and not e2e" -n auto --alluredir=allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke
          path: allure-results
          retention-days: 7

  history:
    name: Publish Allure report
    runs-on: ubuntu-latest
    needs: [unit, integration, e2e]
    if: always() && !cancelled()
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-allure
        with:
          version: ${{ env.ALLURE_VERSION }}

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download previous report for trends
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow tests.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -z "$run_id" ]; then
            echo "Прошлого успешного прогона нет, отчёт будет без трендов"
            exit 0
          fi
          echo "Забираю отчёт прогона $run_id"
          gh run download "$run_id" --name allure-report -D previous-report || \
            echo "Отчёт прогона $run_id недоступен, тренды начнутся заново"

      # merge-multiple раскладывает содержимое артефактов по artifacts/,
      # поэтому результаты оказываются в artifacts/allure-results
      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: artifacts

      - name: Build report with history
        run: |
          test -d artifacts/allure-results || { echo "результаты не найдены"; exit 1; }
          allure generate artifacts/allure-results -o allure-report --clean

      - name: Merge trends from previous report
        run: |
          python scripts/merge_history.py --previous previous-report --report allure-report --max-runs 20

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30

      - name: Upload Pages artifact
        id: pages-artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deploy
        uses: actions/deploy-pages@v5

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [unit, integration, e2e]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: artifacts

      - name: Fail if flaky tests exceed threshold
        run: python scripts/flaky_report.py --results artifacts/allure-results --max-flaky-percent 20
